[package]
name = "gitiup"
description = "The gitiup command line: the user-facing surface that turns a local run into a digest a stranger can check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate is the only place in the workspace that reads a run report off disk:
# the format crate (`gitiup-attest`) refuses I/O so it can run in a pre-receive
# hook, and the host crate (`gitiup-host`) owns storage. Printing a digest for a
# local run belongs to neither, so it lives here.
#
# Deliberately no argument-parsing dependency: the surface is a handful of flags,
# and a parser would be the largest thing in the binary. `tests/cli_hygiene.rs`
# keeps it that way.

[[bin]]
name = "gitiup"
path = "src/main.rs"

[dependencies]
gitiup-attest = { path = "../gitiup-attest" }
# `gitiup run` plans and runs workflows: the planning, the simulated tier and the
# sandbox seam all live there, so the CLI is a front end and not a second
# implementation of "what did this run do".
gitiup-run = { path = "../gitiup-run" }
# `gitiup doctor --sandbox`, and the gate behind `run --execute`: which isolation
# this machine actually provides. Not a second opinion about digests — this crate
# never touches a run report; it answers "may anything be executed here".
gitiup-sandbox = { path = "../gitiup-sandbox" }
# Not a second opinion about the digest: `gitiup-normalise` *is* the digest
# computation for any run whose `normalisation_version` is 1, so a CLI that left it
# out would be re-implementing the rules instead of calling them.
gitiup-normalise = { path = "../gitiup-normalise" }
# The host abstraction and the hosts that ship with it. The CLI is the composition
# root: it is the one crate allowed to decide *which* host serves a remote (see
# `src/remotes.rs`), and it is deliberately the only crate that both knows about
# forge adapters and is not a forge adapter itself.
gitiup-host = { path = "../gitiup-host" }
# The github adapter, behind `hosts-github` (on by default). A build with
# `--no-default-features` has no forge code in it at all: the remote is then refused
# by name, with the flag to turn on in the message.
gitiup-host-github = { path = "../gitiup-host-github", optional = true }
# `gitiup key` and `gitiup identity`: who is signing, and with what. Not a second
# opinion about signatures — `gitiup-keys` builds on `gitiup-attest`'s `Signer`, so a
# keystore key, an ssh-agent identity and a gpg subkey all produce the same
# `SignatureEntry` bytes. The CLI is where a passphrase and a key name get typed, so
# it is the only crate that needs the keystore at all.
gitiup-keys = { path = "../gitiup-keys" }
serde_json = "1"

[features]
default = ["hosts-github"]
# Every forge call — the pull request database, check runs, token auth, API
# pagination, rate limits, the record store inside the repository — lives in
# `gitiup-host-github`, and this feature is the only thing that pulls it in. With it
# off, a forge remote is refused with a message that names this flag.
hosts-github = ["dep:gitiup-host-github"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
