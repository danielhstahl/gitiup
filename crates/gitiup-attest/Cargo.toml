[package]
name = "gitiup-attest"
description = "The attestation format: canonical manifests, digests, signatures and freshness policy, exactly as decided in ADR-0001"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate is the wire format everything else signs. Two rules, both from
# ADR-0001 (docs/adr/0001-attestation-encoding-hash-and-signature.md):
#
# * **No network, ever.** Verification must work on a plane, in a pre-receive
#   hook and in a test. There is deliberately no HTTP client here; log anchors
#   (ADR-0001 D9) are *records*, fetched by whatever code has a transport.
# * **No C toolchain.** Pure-Rust crypto (`sha2`, `ed25519-dalek`) so `gitiup`
#   cross-compiles and lives in a static image. See the ADR, "crypto choices".

[dependencies]
ed25519-dalek = { version = "2", features = ["std"] }
# The canonicaliser, the digest/key-id primitives and the exit-code taxonomy are
# *re-exported* from here, not defined here: ADR-0003 D11 allows exactly one
# implementation of each, and `gitiup-host` — which stores signed records but must
# not depend on this crate — links the same code this one does.
gitiup-canon = { path = "../gitiup-canon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
