[package]
name = "gitiup-host"
description = "Host abstraction for gitiup: refs, packs and a content-addressed blob store, with zero forge dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# NOTE: this crate is the *core* host abstraction. It must stay free of forge
# (GitHub/GitLab/...) clients: adapters live behind feature-gated submodules
# added by later tickets (see giti-xdw.4) and every default-feature build must
# be forge-free. `tests/no_forge_deps.rs` enforces this.
[features]
default = []

# The live S3 transport: `aws-config` resolves the standard AWS credential chain
# (env, shared profile, SSO, web identity/IRSA) and `aws-sdk-s3` talks to the
# bucket. Off by default, so a plain `cargo build` links no HTTP or AWS code: the
# bucket-as-forge host itself is always compiled and is tested against the
# in-process `MemoryBucket`. Turn this on for `S3Host::from_remote`.
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]

[dependencies]
# The shared canonicaliser, digests and Ed25519 key ids (ADR-0003 D11). This is the
# whole of what this crate borrows from the format world — a storage layer must not
# depend on `gitiup-attest` (wire format, trust, freshness policy, a clock), but a
# change record it stores has to be re-hashed and signature-checked by exactly the
# rules the signer used, and "we have our own canonicaliser" is two digests.
gitiup-canon = { path = "../gitiup-canon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
