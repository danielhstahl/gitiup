# Sample gitiup.toml — one repo, four kinds of remote.
#
# gitiup finds this file by walking up from the working directory; set
# GITIUP_CONFIG=/path/to/file to point at it explicitly.
# Copy it to `gitiup.toml` in your repo root and edit.

schema-version = 1
default-remote = "origin"

# The owner's bucket is the forge: refs, packs and records all live in it.
# It must have object versioning on (`aws s3api put-bucket-versioning
# --bucket gitiup-forge --versioning-configuration Status=Enabled`); Object Lock
# is recommended so attestations survive their retention window.
[[remote]]
name = "origin"
url = "s3://gitiup-forge/my-repo"
store-prefix = "gitiup"
credentials-profile = "owner"
timeout = "45s"

[remote.options]
region = "eu-central-1"
# endpoint = "https://git.minio.internal"   # MinIO or another S3-compatible server
# force-path-style = true                   # ...which usually needs path-style addressing
# profile = "ci-writer"                     # a shared-config profile, instead of the env
# conditional-writes = "auto"               # probe once at connect (the default)
# anonymous = true                          # public-read bucket: reads only, no credential sent,
#                                           #   and refused outright by this build's AWS transport
#                                           #   (an anonymous GET is an unsigned one, and the SDK
#                                           #   signs everything) — see docs/federation.md
# ref-cache-ttl = "2s"                      # ref advertisement TTL; "off" disables it
# multipart-threshold-mib = 8               # packs at least this big go up as multipart

# A plain git repo over smart-HTTP, e.g. a read-only mirror on nginx.
[[remote]]
name = "mirror"
url = "https://git.example.com/owner/my-repo.git"
# credentials-profile = "mirror"   # uncomment with the token block below
timeout = 120

# A bare repo on a box you ssh into. The scp-like form
# `git@build.example.net:srv/git/my-repo.git` is accepted too.
[[remote]]
name = "colo"
url = "ssh://git@build.example.net:2222/srv/git/my-repo.git"
credentials-profile = "deploy"

# A local directory store — what the tests, air-gapped setups and a scratch
# bucket-on-disk use. `file://` is a *directory* store: a plain folder gitiup
# fills in, not a git repository.
[[remote]]
name = "scratch"
url = "file:///srv/gitiup/store"

# A repository on the same filesystem. Same transport, different kind of store,
# and the URL cannot tell them apart — so it is said. Without `host-type` a
# `file://` remote at a repository is refused with this line in the hint.
[[remote]]
name = "local-repo"
url = "file:///srv/git/my-repo.git"

[remote.options]
host-type = "git"          # fs | git | s3 | github — see docs/host-abstraction.md
# work-dir = "~/.cache/gitiup/host"   # where the local mirror of it lives

# The bucket is authenticated by the AWS chain — env (access keys or a web
# identity/IRSA), a shared-config profile, or SSO — so this profile names no
# token: an `s3://` remote that *does* name a token is refused, because it would
# be useless here and is a leak waiting to happen.
[credentials.owner]
auth = "cloud-role"

# A token, for a forge remote (see `gitiup-host-github`): the profile names the
# *variable*, and the value is read from the environment when it is used. Never
# put the value here, and never point this at an `s3://` remote — the bucket is
# the AWS chain's alone. A plain-git remote refuses it too: `git` authenticates
# for itself (an ssh key, an agent, a credential helper), and gitiup will not
# hand a token to a transport it cannot scope across a redirect — so over https
# let git use its own helper, over ssh use the `ssh-key` profile below, and put
# the store on a host gitiup authenticates to directly (a bucket, or a forge).
# [credentials.mirror]
# auth = "token"
# token-env = "GITIUP_MIRROR_TOKEN"

[credentials.deploy]
auth = "ssh-key"
key-path = "~/.ssh/id_ed25519"
